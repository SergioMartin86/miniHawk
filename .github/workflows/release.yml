name: Release

# What users download, built only from what the gates passed.
#
# Two kinds of build, deliberately:
#
#   dev      a ROLLING prerelease, replaced on every green push to main. One
#            link that is always the newest; the assets carry the short commit
#            in their names, so a downloaded file still says what it is.
#   nightly  an IMMUTABLE dated prerelease, once a day and only when main moved.
#            The point is not freshness (dev has that) but PERMANENCE. A movie
#            cites the build that recorded it, and someone replaying that run in
#            five years needs THAT build - not a rebuild, because a package's
#            identity is a function of its toolchain, so the same sources
#            through a later gcc are different bytes and a different hash.
#            Nightlies are therefore NEVER deleted. They are the archive.
#
# Nothing is published that did not pass CI. The release job is triggered by the
# CI workflow FINISHING SUCCESSFULLY, and builds that same commit.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  schedule:
    # 05:00 UTC, an hour after CI's own nightly, so it releases a gated commit
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated)'
        required: true
        default: dev
        type: choice
        options: [ dev, nightly ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    # A push-triggered run only publishes when CI was green. A scheduled or
    # manual run has no CI run attached and is gated by the commit's own status
    # check below.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: bundle (windows + linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: What is being released
        id: what
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            kind=dev
          else
            sha="${{ github.sha }}"
            kind="${{ github.event.inputs.kind || 'nightly' }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$sha" | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.what.outputs.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Has main moved since the last nightly?
        id: moved
        if: github.event_name == 'schedule'
        run: |
          # a nightly of an unchanged commit is a second copy of yesterday's
          last=$(git tag -l 'nightly-*' --sort=-creatordate | head -1)
          if [ -n "$last" ] && [ "$(git rev-list -n1 "$last")" = "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main has not moved since $last; nothing to release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Was this commit gated?
        if: github.event_name == 'schedule' && steps.moved.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the scheduled build publishes only a commit CI has passed
          conclusion=$(gh run list --workflow CI --branch main --limit 20 \
            --json headSha,conclusion --jq \
            "[.[] | select(.headSha == \"$(git rev-parse HEAD)\")] | first | .conclusion")
          if [ "$conclusion" != "success" ]; then
            echo "CI has not passed for $(git rev-parse --short HEAD) (conclusion: ${conclusion:-none})" >&2
            exit 1
          fi

      - name: Install build dependencies
        if: steps.moved.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 \
            mingw-w64 \
            libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        if: steps.moved.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: What the cores are pinned at
        id: pins
        if: steps.moved.outputs.skip != 'true'
        run: |
          # the cache key is the exact core commits plus the guest kit they
          # build against: bump one core, rebuild one core
          git submodule status extern/cores/* extern/tools/chimera-common-minibox > core-pins.txt
          cat core-pins.txt

      - name: Cache the core guest builds
        if: steps.moved.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            extern/cores/*/build
            extern/cores/*/waterbox/obj-guest
            extern/cores/*/waterbox/bin
          key: cores-${{ hashFiles('core-pins.txt') }}-${{ runner.os }}

      # The PS3 core's LLVM on its own key. It is hours of build on a runner and
      # it only changes when that core does, so it must not be thrown away every
      # time some other core is bumped - which the cache above, keyed on EVERY
      # pin, would do. Restored after it, so these paths win.
      - name: What rpcs3 is pinned at
        id: rpcs3pin
        if: steps.moved.outputs.skip != 'true'
        run: git submodule status extern/cores/rpcs3 > rpcs3-pin.txt

      - name: Cache the PS3 core's LLVM
        if: steps.moved.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            extern/cores/rpcs3/build/llvm-native
            extern/cores/rpcs3/build/llvm-guest
          key: rpcs3-llvm-${{ hashFiles('rpcs3-pin.txt') }}-${{ runner.os }}

      - name: Build the Linux bundle
        if: steps.moved.outputs.skip != 'true'
        run: ./tools/build-bundle.sh --platform linux --out build/bundle-linux

      - name: Build the Windows bundle
        if: steps.moved.outputs.skip != 'true'
        # only the natives differ between the two: the managed assemblies are IL
        # and every core.wbx is OS-independent, so both bundles ship the same
        # packages byte for byte
        run: ./tools/build-bundle.sh --platform windows --out build/bundle-windows --skip-cores

      - name: Pack
        id: pack
        if: steps.moved.outputs.skip != 'true'
        run: |
          short="${{ steps.what.outputs.short }}"
          mkdir -p build/release
          ( cd build/bundle-windows && zip -qr "../release/chimera-win-x64-$short.zip" . )
          ( cd build/bundle-linux && tar czf "../release/chimera-linux-x64-$short.tar.gz" . )
          cp build/bundle-windows/LICENSES.md build/release/LICENSES.md
          cp build/bundle-windows/BUILD.txt build/release/BUILD.txt
          ls -la build/release

      - name: Release notes
        id: notes
        if: steps.moved.outputs.skip != 'true'
        run: |
          short="${{ steps.what.outputs.short }}"
          {
            echo "Built from \`$short\` - $(git log -1 --format=%s)"
            echo
            echo "| what | file |"
            echo "| --- | --- |"
            echo "| Windows x64 | \`chimera-win-x64-$short.zip\` |"
            echo "| Linux x64 | \`chimera-linux-x64-$short.tar.gz\` |"
            echo
            echo "Both carry the frontend, its natives and every core package."
            echo "\`BUILD.txt\` names the exact commit of each, and \`LICENSES.md\`"
            echo "states the terms of the whole bundle."
            echo
            echo "**This bundle is NON-COMMERCIAL**: it includes cores (Genesis Plus GX,"
            echo "Opera, Snes9x) whose licences forbid commercial use, and that binds the"
            echo "whole distribution. See LICENSES.md."
            echo
            echo "Windows will warn that the executable is unsigned and from an unknown"
            echo "publisher; it is not signed, and there is no way around that warning"
            echo "short of buying a certificate."
            echo
            echo "### Cores in this build"
            echo
            echo '```'
            git submodule status extern/cores/* | sed 's/^ //'
            echo '```'
          } > build/release/NOTES.md

      - name: Publish the rolling dev release
        if: steps.moved.outputs.skip != 'true' && steps.what.outputs.kind == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ONE TAG, MOVED - through the API, never `git push`. A workflow's
          # token may not create or update workflow FILES, and pushing a tag at
          # a commit whose .github/workflows differ from the default branch's
          # counts as exactly that: the first release of this pipeline died on
          # "refusing to allow a GitHub App to create or update workflow" while
          # publishing a commit main had already moved past. Deleting the
          # release with its tag and recreating it at the built commit goes
          # through the releases API, which has no such restriction, and keeps
          # the tag honest about which build the assets came from.
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev --target "${{ steps.what.outputs.sha }}" \
            --title "Development build ${{ steps.what.outputs.short }}" \
            --notes-file build/release/NOTES.md --prerelease

          # straight away, so the window in which /releases/tag/dev has nothing
          # to download is as short as an upload
          gh release upload dev build/release/chimera-*.zip build/release/chimera-*.tar.gz \
            build/release/LICENSES.md build/release/BUILD.txt --clobber

      - name: Archive every distinct core package, forever
        if: steps.moved.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A movie cites the SHA1 of the CORE PACKAGE that recorded it, and
          # what a replay must match is that package: sync is the core, its
          # settings and its firmware, not the frontend built around them. Core
          # packages also change rarely - only when a core's submodule is bumped
          # - and are small (five of the seven are about a megabyte).
          #
          # So every DISTINCT package is kept forever under one tag, named by
          # its own hash. Whatever CorePackageSha1 a movie names, years later,
          # is still downloadable - even if it was recorded on a rolling dev
          # build whose bundle has long since been replaced.
          gh release view cores >/dev/null 2>&1 || \
            gh release create cores --title "Core package archive" --prerelease --notes \
              "Every distinct core package Chimera has published, named <core>-<sha1>.chimeraCore. A movie cites the SHA1 of the package that recorded it; this is where that package stays. Assets named <core>-<sha1>.zip are the same format under the older name."
          existing=$(gh release view cores --json assets --jq '.assets[].name')
          for zip in build/bundle-windows/Cores/*.chimeraCore; do
            base=$(basename "$zip" .chimeraCore)
            sha=$(sha1sum "$zip" | cut -c1-12)
            asset="$base-$sha.chimeraCore"
            if printf '%s\n' "$existing" | grep -qx "$asset"; then
              echo "already archived: $asset"
              continue
            fi
            cp "$zip" "build/release/$asset"
            gh release upload cores "build/release/$asset"
            echo "archived $asset"
          done

      - name: Publish the nightly
        if: steps.moved.outputs.skip != 'true' && steps.what.outputs.kind == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nightly-${{ steps.what.outputs.date }}"
          gh release view "$tag" >/dev/null 2>&1 && { echo "$tag already exists"; exit 0; }
          gh release create "$tag" --target "${{ steps.what.outputs.sha }}" \
            --title "Nightly ${{ steps.what.outputs.date }} (${{ steps.what.outputs.short }})" \
            --notes-file build/release/NOTES.md --prerelease
          gh release upload "$tag" build/release/chimera-*.zip build/release/chimera-*.tar.gz \
            build/release/LICENSES.md build/release/BUILD.txt --clobber

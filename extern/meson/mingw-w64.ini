# Cross file: build Windows (x86_64) artifacts from a Linux host via mingw-w64.
#   meson setup build/meson-windows --cross-file extern/meson/mingw-w64.ini
# GCC runtime libs are linked statically so the produced dlls depend only on
# msvcrt/system dlls (Chimera ships no libgcc/libwinpthread).

[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[built-in options]
c_link_args = ['-static']
cpp_link_args = ['-static']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
